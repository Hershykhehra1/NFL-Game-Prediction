services:
  - type: web
    name: nfl-game-prediction-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        value: https://aiesymlaxxpqatflouje.supabase.co
      - key: SUPABASE_KEY
        sync: false
